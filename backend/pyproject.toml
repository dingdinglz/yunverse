[project]
name = "backend"
version = "1.0.0"
description = "虚拟乐器演奏项目后端 (virtual-instrument-backend)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=2.0",
    "bleak>=0.22",
    "scipy>=1.12",
    "hmmlearn>=0.3",
    "scikit-learn>=1.4",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
default = true
